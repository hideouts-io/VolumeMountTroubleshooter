name: macOS CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-universal:
    name: Build and verify universal app
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release tag against app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          if [[ "$RELEASE_TAG" != "v$app_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match CFBundleShortVersionString $app_version" >&2
            exit 1
          fi

      - name: Build, test, sign, package, and checksum
        run: ./script/build_release.sh

      - name: Confirm universal architecture set
        run: |
          /usr/bin/xcrun lipo \
            "build/Volume Mount Troubleshooter.app/Contents/MacOS/VolumeMountTroubleshooter" \
            -verify_arch arm64 x86_64

      - name: Upload universal release files
        uses: actions/upload-artifact@v7
        with:
          name: VolumeMountTroubleshooter-macOS-universal-${{ github.sha }}
          path: |
            dist/VolumeMountTroubleshooter-*-macOS-universal.zip
            dist/VolumeMountTroubleshooter-*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  verify-intel:
    name: Verify packaged app on Intel
    needs: build-universal
    runs-on: macos-15-intel

    steps:
      - name: Check out verification script
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download universal release files
        uses: actions/download-artifact@v8
        with:
          name: VolumeMountTroubleshooter-macOS-universal-${{ github.sha }}
          path: dist

      - name: Verify checksum, signature, architectures, and Intel self-tests
        run: |
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          ./script/verify_release.sh \
            "dist/VolumeMountTroubleshooter-v$app_version-macOS-universal.zip" \
            "dist/VolumeMountTroubleshooter-v$app_version-SHA256SUMS.txt"

  publish-release:
    name: Publish verified tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-universal, verify-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release files
        uses: actions/download-artifact@v8
        with:
          name: VolumeMountTroubleshooter-macOS-universal-${{ github.sha }}
          path: dist

      - name: Publish release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Volume Mount Troubleshooter $RELEASE_TAG" \
            --generate-notes \
            --latest
